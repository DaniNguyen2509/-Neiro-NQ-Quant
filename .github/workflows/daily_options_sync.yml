name: CME E-mini Nasdaq Options Automated Sync & Tactical Terminal (Neiro-NQ-Quant)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  schedule:
    # 1. Chot Open Interest ngay moi tu CME Clearing (07:15 VN = 00:15 UTC):
    - cron: '15 0 * * 1-5'
    # 2. Phien Au (14:30 VN = 07:30 UTC):
    - cron: '30 7 * * 1-5'
    # 3. Phien My Pre-market (19:45 VN = 12:45 UTC):
    - cron: '45 12 * * 1-5'
    # 4. Phien My Cao diem & Xuyen suot phien (Moi 1 tieng tu 20:45 den 02:45 VN = 13:45 den 19:45 UTC):
    - cron: '45 13,14,15,16,17,18,19 * * 1-5'
  workflow_dispatch:
    inputs:
      basis:
        description: 'Spot MT5 Basis Offset (e.g. 0.0 or 15.0)'
        required: false
        default: '0.0'
        type: string
      source:
        description: 'Options Data Source (yfinance = free & fast, barchart = Playwright)'
        required: false
        default: 'yfinance'
        type: choice
        options:
          - yfinance
          - barchart

concurrency:
  group: options-sync
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    name: Sync Nasdaq Options & Deploy Tactical Terminal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly scipy numpy yfinance requests pyarrow duckdb

      - name: Generate Plotly Tactical HTML Dashboard (Fast & Free)
        run: |
          BASIS_VAL="${{ github.event.inputs.basis || '0.0' }}"
          DATA_SOURCE="${{ github.event.inputs.source || 'yfinance' }}"
          echo "[*] Running Neiro-NQ-Quant with Source: $DATA_SOURCE, Basis: $BASIS_VAL..."
          python -m src.hud.html_dashboard --source "$DATA_SOURCE" --basis "$BASIS_VAL" --output exports/latest_nq_dashboard.html exports/index.html
          ls -lh exports/

      - name: Upload Tactical Dashboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-tactical-dashboard
          path: |
            exports/latest_nq_dashboard.html
            exports/index.html
            exports/nq_tactical_levels.json
            data/options_prices_NQZ26.csv
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports

      - name: Commit and Push Updated Options Data
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/options_prices_NQZ26.csv exports/nq_tactical_levels.json || true
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync Nasdaq NQ options chain [skip ci]" && git push)
