name: CME E-mini Nasdaq Options Automated Sync & Tactical Terminal (Neiro-NQ-Quant)

on:
  schedule:
    # 1. Chot Open Interest ngay moi tu CME Clearing (07:15 VN):
    - cron: '15 0 * * 1-5'

    # 2. Phien Au 2 nac (Pre-Europe & In-Session Europe thich ung ca 2 mua):
    #    05:30 UTC = 12:30 VN (Pre-Europe Mua He: truoc Frankfurt 13:00 & London 14:00)
    #    06:30 UTC = 13:30 VN (Pre-Europe Mua Dong: truoc Frankfurt 14:00 & London 15:00)
    #    07:30 UTC = 14:30 VN (In-Session Europe Mua He sau khi London chay 30p)
    #    08:30 UTC = 15:30 VN (In-Session Europe Mua Dong sau khi London chay 30p)
    - cron: '30 5,6,7,8 * * 1-5'

    # 3. Phien My don tin vi mo (18:45 VN), gio cao diem NYSE & 0DTE Power Hour (02:45 VN):
    #    11:45 UTC = 18:45 VN (Pre-US: don dau tin vi mo CPI/NFP 19:30 he / 20:30 dong 45p)
    #    12:45 UTC = 19:45 VN (Pre-market NYSE Mua He: truoc mo cua 20:30)
    #    13:45 UTC = 20:45 VN (In-Session He sau mo cua 15p / Pre-market NYSE Mua Dong)
    #    14:45 UTC = 21:45 VN (Cao diem He / In-Session Dong sau mo cua 15p)
    #    15:45, 16:45 UTC = 22:45, 23:45 VN (Xuyen suot giua phien & London Fix 00:00)
    #    17:45, 18:45 UTC = 00:45, 01:45 VN (Nua sau phien My)
    #    19:45 UTC = 02:45 VN (Radar don dau 0DTE Power Hour truoc gio dong cua NYSE)
    - cron: '45 11,12,13,14,15,16,17,18,19 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_options_sync.yml'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      basis:
        description: 'Spot MT5 Basis Offset (e.g. 0.0 or 15.0)'
        required: false
        default: '0.0'
        type: string
      source:
        description: 'Options Data Source (yfinance = free & fast, barchart = Playwright)'
        required: false
        default: 'yfinance'
        type: choice
        options:
          - yfinance
          - barchart

concurrency:
  group: options-sync
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    name: Sync Nasdaq Options & Deploy Tactical Terminal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly scipy numpy yfinance requests pyarrow duckdb

      - name: Generate Plotly Tactical HTML Dashboard (Fast & Free)
        run: |
          BASIS_VAL="${{ github.event.inputs.basis || '0.0' }}"
          DATA_SOURCE="${{ github.event.inputs.source || 'yfinance' }}"
          echo "[*] Running Neiro-NQ-Quant with Source: $DATA_SOURCE, Basis: $BASIS_VAL..."
          python -m src.hud.html_dashboard --source "$DATA_SOURCE" --basis "$BASIS_VAL" --output exports/latest_nq_dashboard.html exports/index.html
          ls -lh exports/

      - name: Upload Tactical Dashboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-tactical-dashboard
          path: |
            exports/latest_nq_dashboard.html
            exports/index.html
            data/options_prices_NQZ26.csv
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports

      - name: Commit and Push Updated Options Data
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f data/options_prices_NQZ26.csv ]; then
            git add data/options_prices_NQZ26.csv
            git diff --staged --quiet || (git commit -m "chore(data): auto-sync Nasdaq NQ options chain [skip ci]" && git push)
          fi
