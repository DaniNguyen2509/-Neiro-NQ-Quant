name: Daily Nasdaq Quant Automation

on:
  # Tam dung schedule tu dong de nhuong quota GitHub Actions cho Gold
  # schedule:
  #   # Chay tu dong truoc phien A, phien Au va phien My (UTC Time, Thu 2 den Thu 6)
  #   - cron: '0 6,12,13,15,19,21 * * 1-5'
  workflow_dispatch:
    # Cho phep trigger bang tay 1-Click tu giao dien GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nasdaq Quant Pipeline
        run: |
          python -m src.main --dual-frame --export-html

      - name: Upload Tactical Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-tactical-dashboard
          path: |
            exports/latest_nq_dashboard.html
            exports/nq_tactical_levels.json
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports
